[package]
name = "circuiter-app"
description = "Circuiter desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "circuiter-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
circuiter-model.workspace = true
circuiter-scene.workspace = true
circuiter-stdlib.workspace = true
clap.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"

[lints]
workspace = true
